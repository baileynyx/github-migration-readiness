name: Inventory tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      # Real Git, disposable local repositories: assert both a match and the
      # expected failure after branch/tag changes, including annotation-only drift.
      - name: Rehearse Git ref verification
        run: python rehearse_refs.py --output-dir reports/ref-rehearsal
      - name: Show synthetic ref differences
        run: cat reports/ref-rehearsal/broken/refs.md >> "$GITHUB_STEP_SUMMARY"
      # The sample deliberately contains blockers; generate it without failing CI.
      - run: python readiness.py examples/inventory.json --output-dir reports --fail-on never
      # Keep the full assessment separate from the original minimal example.
      # Both deliberately contain findings; the tests verify blocking exit codes.
      - run: python readiness.py examples/migration-assessment/inventory.json --output-dir reports/migration-assessment --fail-on never
      # Exercise collect -> assess -> report using synthetic HTTP replies only.
      # The collector uses a fresh folder and the fixture needs no account/PAT.
      - run: python collect_azure_devops.py --fixture examples/azure-devops/responses.json --output-dir reports/azure-devops
      - run: python readiness.py reports/azure-devops/inventory.json --output-dir reports/azure-devops --fail-on never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-readiness-report
          path: reports/
          retention-days: 7
