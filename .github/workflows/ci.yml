name: Inventory tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Inventory and Git rehearsal (${{ matrix.os }})
    strategy:
      # Finish both platforms so one failure does not hide the other's evidence.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: windows-latest
            shell: pwsh
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Test package integrity boundaries
        run: python -m unittest discover -s tools -p test_release.py -v
      - name: Build the committed versioned ZIP twice
        run: |
          python build_release.py --output-dir dist
          python build_release.py --output-dir dist-repeat
          python -c "from pathlib import Path; a=Path('dist/github-migration-readiness-1.0.0.zip').read_bytes(); b=Path('dist-repeat/github-migration-readiness-1.0.0.zip').read_bytes(); assert a == b, 'Repeated package builds differ'"
      - name: Run the product from the extracted ZIP
        run: python check_package.py dist/github-migration-readiness-1.0.0.zip --output-dir reports/package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Each OS uploads the exact bytes it tested, plus the source commit,
          # archive hash and observed command results. No release is published.
          name: migration-package-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.sha256
            reports/package/package-check.json
          if-no-files-found: error
          retention-days: 14
      # Real Git, disposable local repositories: assert both a match and the
      # expected failure after branch/tag changes, including annotation-only drift.
      - name: Rehearse Git ref verification
        run: python rehearse_refs.py --output-dir reports/ref-rehearsal
      - name: Show synthetic ref differences (Bash)
        if: runner.os == 'Linux'
        run: cat reports/ref-rehearsal/broken/refs.md >> "$GITHUB_STEP_SUMMARY"
      - name: Show synthetic ref differences (PowerShell)
        if: runner.os == 'Windows'
        run: Get-Content reports/ref-rehearsal/broken/refs.md -Raw -Encoding utf8 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Check the PowerShell difference gate
        if: runner.os == 'Windows'
        # A detected difference must return 1 and still write its report. Capture
        # that native exit code immediately; only this expected failure is accepted.
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          python verify_refs.py examples/ref-verification/source.refs examples/ref-verification/destination.refs --output-dir reports/powershell-ref-gate
          if ($LASTEXITCODE -ne 1) { throw 'Expected ref differences to return exit code 1.' }
          if (-not (Test-Path reports/powershell-ref-gate/refs.md)) { throw 'Expected difference report is missing.' }
          exit 0
      # The sample deliberately contains blockers; generate it without failing CI.
      - run: python readiness.py examples/inventory.json --output-dir reports --fail-on never
      # Keep the full assessment separate from the original minimal example.
      # Both deliberately contain findings; the tests verify blocking exit codes.
      - run: python readiness.py examples/migration-assessment/inventory.json --output-dir reports/migration-assessment --fail-on never
      # Classify synthetic repositories before scheduling. The example's review
      # and transformation paths are expected planning results, not CI failures.
      - run: python classify_repositories.py examples/pre-migration/inventory.json --output-dir reports/pre-migration --fail-on never
      # Exercise collect -> assess -> report using synthetic HTTP replies only.
      # The collector uses a fresh folder and the fixture needs no account/PAT.
      - run: python collect_azure_devops.py --fixture examples/azure-devops/responses.json --output-dir reports/azure-devops
      - run: python readiness.py reports/azure-devops/inventory.json --output-dir reports/azure-devops --fail-on never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Matrix jobs must upload distinct artifacts; each contains its own
          # captures and execution evidence from that platform's actual rehearsal.
          name: synthetic-readiness-report-${{ matrix.os }}
          path: reports/
          if-no-files-found: error
          retention-days: 7
